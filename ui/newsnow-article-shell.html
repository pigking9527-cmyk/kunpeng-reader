<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>资讯正文</title>
    <style>
      :root { color-scheme: light; background: #f8fbff; color: #26384f; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #ffffff, #eef5ff); }
      .loading { display: grid; justify-items: center; gap: 14px; color: #647893; font-size: 15px; }
      .dot { width: 28px; height: 28px; border: 3px solid #c8d9ed; border-top-color: #477dcb; border-radius: 50%; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="loading" role="status" aria-live="polite"><span class="dot"></span><span>正在打开资讯…</span></div>
  </body>
</html>
