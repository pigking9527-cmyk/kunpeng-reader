<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>书架全文检索</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f4f8;
        --surface: rgba(255, 255, 255, 0.92);
        --surface-strong: #fff;
        --line: rgba(54, 68, 92, 0.12);
        --text: #202635;
        --muted: #7b8496;
        --accent: #426ee8;
        --accent-soft: #edf2ff;
        --mark: #ffe39b;
        --shadow: 0 18px 48px rgba(44, 58, 87, 0.11);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-width: 0; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        color: var(--text);
        background:
          radial-gradient(circle at 12% -10%, rgba(88, 128, 235, 0.14), transparent 32%),
          var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      button, input, select { font: inherit; }
      .search-shell {
        position: relative;
        z-index: 4;
        flex: 0 0 auto;
        padding: 18px 20px 12px;
        background: linear-gradient(180deg, rgba(242, 244, 248, 0.98), rgba(242, 244, 248, 0.84));
        backdrop-filter: blur(16px);
      }
      .search-row { display: flex; align-items: stretch; gap: 10px; max-width: 1180px; margin: 0 auto; }
      .qbox { position: relative; display: flex; flex: 1 1 360px; min-width: 160px; }
      .q {
        width: 100%; height: 46px; padding: 0 16px;
        color: var(--text); background: var(--surface-strong);
        border: 1px solid var(--line); border-radius: 14px;
        outline: none; box-shadow: 0 4px 16px rgba(43, 57, 86, 0.06);
        transition: border-color .16s ease, box-shadow .16s ease;
      }
      .q:focus { border-color: rgba(66, 110, 232, .66); box-shadow: 0 0 0 4px rgba(66, 110, 232, .11); }
      .primary, .control, .mode, .build-button {
        min-height: 42px; border: 1px solid var(--line); border-radius: 12px;
        color: var(--text); background: var(--surface-strong); cursor: pointer;
        transition: background .15s ease, border-color .15s ease, transform .15s ease;
      }
      .primary { height: 46px; padding: 0 20px; color: #fff; border-color: transparent; background: var(--accent); font-weight: 650; }
      .primary:hover { background: #315ed9; transform: translateY(-1px); }
      .control { height: 46px; padding: 0 12px; }
      .control:hover, .mode:hover, .build-button:hover { border-color: rgba(66, 110, 232, .42); background: var(--accent-soft); }
      .options-row {
        display: flex; align-items: center; justify-content: space-between; gap: 14px;
        max-width: 1180px; margin: 10px auto 0;
      }
      .modes { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.55); }
      .mode { min-height: 32px; padding: 0 15px; border-color: transparent; background: transparent; color: var(--muted); border-radius: 9px; }
      .mode.active { color: var(--accent); background: var(--surface-strong); box-shadow: 0 3px 10px rgba(43, 57, 86, .08); font-weight: 650; }
      .semantic-actions { display: none; align-items: center; gap: 10px; min-width: 0; }
      body.semantic-mode .semantic-actions { display: flex; }
      .build-button { min-height: 34px; padding: 0 12px; color: var(--accent); }
      .build-button:disabled { opacity: .55; cursor: default; transform: none; }
      .sem-progress { min-width: 0; max-width: 480px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .summary { flex: 0 0 auto; min-height: 32px; padding: 6px 22px 8px; color: var(--muted); font-size: 12.5px; text-align: center; }
      .results { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 20px 24px; }
      .results-inner { max-width: 1180px; margin: 0 auto; }
      .book-group {
        margin: 10px 0; overflow: hidden; content-visibility: auto; contain-intrinsic-size: 62px;
        background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 5px 20px rgba(43,57,86,.055);
      }
      .book-head { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 12px 16px; cursor: pointer; }
      .book-head:hover { background: var(--accent-soft); }
      .caret { color: #8a9cc9; font-size: 11px; transition: transform .15s ease; }
      .book-group.collapsed .caret { transform: rotate(-90deg); }
      .book-group.collapsed .hits { display: none; }
      .book-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 680; }
      .book-author { color: var(--muted); font-size: 12px; white-space: nowrap; }
      .book-count { margin-left: auto; flex: 0 0 auto; padding: 4px 9px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; font-size: 11px; }
      .hit { padding: 11px 18px 12px 40px; border-top: 1px solid var(--line); cursor: pointer; font-size: 13.5px; line-height: 1.75; }
      .hit:hover { background: rgba(237,242,255,.7); }
      .hit .ch, .hit .hit-meta { margin-right: 8px; color: #8b96ae; font-size: 11px; }
      .hit mark { padding: 0 2px; color: inherit; background: var(--mark); border-radius: 3px; }
      .more { padding: 9px 18px 10px 40px; color: #7184b8; border-top: 1px solid var(--line); cursor: pointer; font-size: 12px; }
      .more:hover { color: var(--accent); background: var(--accent-soft); }
      .empty, .loading { max-width: 1180px; margin: 10px auto; padding: 72px 24px; color: var(--muted); text-align: center; background: rgba(255,255,255,.48); border: 1px dashed var(--line); border-radius: 18px; }
      .qhistory {
        position: absolute; top: calc(100% + 7px); left: 0; right: 0; z-index: 30; display: none;
        max-height: 280px; overflow-y: auto; padding: 6px;
        background: var(--surface-strong); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
      }
      .qhistory.show { display: block; }
      .qh-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: 13px; }
      .qh-item:hover { background: var(--accent-soft); }
      .qh-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .qh-del { flex: 0 0 auto; padding: 0 4px; color: #a5adbd; }
      .qh-del:hover { color: #d85a55; }
      .qh-empty { padding: 8px 10px 5px; color: var(--muted); font-size: 12px; }
      .search-dialog { width: min(440px, calc(100vw - 40px)); padding: 0; color: var(--text); background: var(--surface-strong); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
      .search-dialog::backdrop { background: rgba(24, 31, 46, .30); backdrop-filter: blur(4px); }
      .dialog-body { padding: 22px 22px 14px; }
      .dialog-title { margin: 0 0 8px; font-size: 18px; }
      .dialog-message { margin: 0; color: var(--muted); line-height: 1.7; white-space: pre-line; }
      .dialog-actions { display: flex; justify-content: flex-end; padding: 0 22px 20px; }
      .dialog-actions button { min-width: 88px; height: 38px; color: #fff; background: var(--accent); border: 0; border-radius: 10px; cursor: pointer; }
      @media (max-width: 720px) {
        .search-shell { padding: 12px 12px 8px; }
        .search-row { flex-wrap: wrap; }
        .qbox { flex-basis: calc(100% - 86px); }
        .primary { flex: 1; }
        .control { order: 3; flex: 1; }
        .options-row { align-items: flex-start; flex-direction: column; gap: 8px; }
        .results { padding: 0 12px 16px; }
        .hit, .more { padding-left: 18px; }
        .book-author { display: none; }
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #171a21; --surface: rgba(35,39,48,.94); --surface-strong: #252a34; --line: rgba(224,230,242,.12); --text: #e8ebf2; --muted: #9ca6b8; --accent: #82a2ff; --accent-soft: rgba(82,115,205,.18); --mark: #745f25; --shadow: 0 20px 54px rgba(0,0,0,.34); }
        .search-shell { background: linear-gradient(180deg, rgba(23,26,33,.98), rgba(23,26,33,.84)); }
        .primary, .dialog-actions button { color: #10172a; background: #8ba9ff; }
        .modes { background: rgba(28,32,40,.6); }
        .empty, .loading { background: rgba(35,39,48,.54); }
      }
    </style>
  </head>
  <body>
    <section class="search-shell" aria-label="书架搜索">
      <div class="search-row">
        <div class="qbox">
          <input id="q" class="q" type="search" autocomplete="off" placeholder="输入正文关键词…" aria-label="搜索内容" />
          <div id="qhistory" class="qhistory"></div>
        </div>
        <button id="go" class="primary" type="button">搜索</button>
        <select id="sort" class="control" title="排序" aria-label="结果排序">
          <option value="count">相关度</option>
          <option value="hits">命中最多</option>
          <option value="title">按书名</option>
          <option value="author">按作者</option>
        </select>
      </div>
      <div class="options-row">
        <div class="modes" aria-label="检索方式">
          <button id="mode-kw" class="mode active" type="button">关键词</button>
          <button id="mode-sem" class="mode" type="button">语义</button>
        </div>
        <div class="semantic-actions">
          <span id="sem-progress" class="sem-progress"></span>
          <button id="build-sem" class="build-button" type="button">建立语义索引</button>
        </div>
      </div>
    </section>
    <div id="summary" class="summary" role="status" aria-live="polite"></div>
    <main id="results" class="results"><div class="results-inner"></div></main>
    <dialog id="search-alert" class="search-dialog">
      <div class="dialog-body">
        <h2 id="search-alert-title" class="dialog-title">语义检索未就绪</h2>
        <p id="search-alert-message" class="dialog-message"></p>
      </div>
      <div class="dialog-actions"><button id="search-alert-ok" type="button">知道了</button></div>
    </dialog>
    <script src="generated-ts/search-result-rules.js"></script>
    <script src="generated-ts/search-history-rules.js"></script>
    <script src="generated-ts/search.js"></script>
  </body>
</html>
