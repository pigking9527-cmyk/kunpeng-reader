[package]
name = "reader-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-platform reading domain, parsing and synchronization core for Kunpeng Reader"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "0.1"
epub = { version = "2.1.5", path = "../vendor/epub" }
mobi = "0.8"
ammonia = "4.1"
