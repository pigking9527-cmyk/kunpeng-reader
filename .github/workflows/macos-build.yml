name: macOS Apple Silicon build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Replace the matching vX.Y.Z macOS assets in GitHub Release"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - codex/macos-build

permissions:
  contents: read

jobs:
  build:
    name: Apple Silicon app and DMG
    runs-on: macos-14
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Ad-hoc signing prevents Gatekeeper from treating an unsigned app bundle
      # as structurally damaged. A public release still needs Developer ID
      # signing and Apple notarization.
      APPLE_SIGNING_IDENTITY: "-"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-aarch64

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Run UI tests
        run: node --test ui/tests/*.test.cjs

      # The semantic search runtime does not ship Intel macOS prebuilt binaries.
      - name: Build Apple Silicon macOS bundles
        run: cargo tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify macOS application signature
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          codesign --display --verbose=4 "$app_path"

      - name: Prepare artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="target/aarch64-apple-darwin/release/bundle"
          out_dir="target/macos-release"
          mkdir -p "$out_dir"

          app_path="$(find "$bundle_dir/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          dmg_path="$(find "$bundle_dir/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$app_path"
          test -n "$dmg_path"

          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$out_dir/Kunpeng-Reader-v${version}-macOS-Apple-Silicon.app.zip"
          cp "$dmg_path" "$out_dir/Kunpeng-Reader-v${version}-macOS-Apple-Silicon.dmg"
          (cd "$out_dir" && shasum -a 256 * > SHA256SUMS.txt)

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Kunpeng-Reader-macOS-Apple-Silicon
          path: target/macos-release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish macOS release assets
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download verified macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: Kunpeng-Reader-macOS-Apple-Silicon
          path: target/macos-release

      - name: Replace GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          out_dir="target/macos-release"
          mv "$out_dir/SHA256SUMS.txt" "$out_dir/SHA256SUMS-macOS.txt"
          gh release upload "v${version}" \
            "$out_dir/Kunpeng-Reader-v${version}-macOS-Apple-Silicon.app.zip" \
            "$out_dir/Kunpeng-Reader-v${version}-macOS-Apple-Silicon.dmg" \
            "$out_dir/SHA256SUMS-macOS.txt" \
            --clobber
