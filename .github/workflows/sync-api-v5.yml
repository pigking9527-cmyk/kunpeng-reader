name: Sync API v5 build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-api-v5.yml"
      - "server/reader-sync-api-rs/**"
      - "contracts/fixtures/api-v5-entity-envelope.json"
      - "contracts/fixtures/intelligence-*.json"
      - "contracts/intelligence/**"
  pull_request:
    paths:
      - ".github/workflows/sync-api-v5.yml"
      - "server/reader-sync-api-rs/**"
      - "contracts/fixtures/api-v5-entity-envelope.json"
      - "contracts/fixtures/intelligence-*.json"
      - "contracts/intelligence/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-api-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux x86_64 provenance artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout committed source
        uses: actions/checkout@v7

      - name: Setup Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/reader-sync-api-rs

      - name: Check formatting, tests, lint, and migration tooling
        working-directory: server/reader-sync-api-rs
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          bash scripts/check-migrations.sh
          bash scripts/test-rehearsal-tools.sh

      - name: Build locked release binary
        working-directory: server/reader-sync-api-rs
        run: cargo build --release --locked

      - name: Create, stage, and verify provenance candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/sync-api-v5-staging
          cp server/reader-sync-api-rs/target/release/reader-sync-api \
            target/sync-api-v5-staging/reader-sync-api
          chmod 0755 target/sync-api-v5-staging/reader-sync-api
          server/reader-sync-api-rs/scripts/create-artifact-provenance.sh \
            --binary target/sync-api-v5-staging/reader-sync-api \
            --output target/sync-api-v5-staging/provenance.txt
          server/reader-sync-api-rs/scripts/create-artifact-provenance.sh \
            --verify \
            --binary target/sync-api-v5-staging/reader-sync-api \
            --manifest target/sync-api-v5-staging/provenance.txt
          server/reader-sync-api-rs/scripts/stage-artifact-bundle.sh \
            --binary target/sync-api-v5-staging/reader-sync-api \
            --manifest target/sync-api-v5-staging/provenance.txt \
            --output-dir target/sync-api-v5-release
          server/reader-sync-api-rs/scripts/stage-artifact-bundle.sh \
            --verify \
            --bundle-dir target/sync-api-v5-release

      - name: Stage and verify the restricted upload bundle
        shell: bash
        run: |
          set -euo pipefail
          server/reader-sync-api-rs/scripts/stage-artifact-bundle.sh \
            --binary target/sync-api-v5-release/reader-sync-api \
            --manifest target/sync-api-v5-release/provenance.txt \
            --output-dir target/sync-api-v5-upload
          server/reader-sync-api-rs/scripts/stage-artifact-bundle.sh \
            --verify \
            --bundle-dir target/sync-api-v5-upload

      - name: Upload release-candidate artifact
        uses: actions/upload-artifact@v6
        with:
          name: reader-sync-api-v5-linux-x86_64
          path: target/sync-api-v5-upload/
          if-no-files-found: error
          retention-days: 14

      # These runners are deliberately separate from the deployable artifact.
      # They exist only to execute the explicit, protected PostgreSQL/S3 E2E
      # suites against a disposable remote target when that target has no Rust
      # toolchain.  The manifest binds every runner to this exact source SHA.
      - name: Package protected E2E test runners
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/sync-api-v5-e2e-runners
          printf 'schema=kunpeng-reader-sync-api-e2e-runners-v1\nsource_commit=%s\n' "$GITHUB_SHA" \
            > target/sync-api-v5-e2e-runners/manifest.txt
          lib_runner=$(cargo test --manifest-path server/reader-sync-api-rs/Cargo.toml --lib --no-run \
            --message-format=json --locked | python3 -c '
          import json, sys
          candidates = []
          for line in sys.stdin:
              try:
                  message = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if (message.get("reason") == "compiler-artifact"
                      and "lib" in message.get("target", {}).get("kind", [])
                      and message.get("profile", {}).get("test")
                      and message.get("executable")):
                  candidates.append(message["executable"])
          if len(candidates) != 1:
              raise SystemExit(f"expected one library test runner, found {len(candidates)}")
          print(candidates[0])')
          for stem in \
            object_store_e2e \
            postgres_intelligence_archive_recovery_e2e \
            postgres_intelligence_e2e \
            postgres_intelligence_route_e2e \
            reader_sync_api; do
            if [[ "$stem" == reader_sync_api ]]; then
              runner=$lib_runner
            else
              runner=$(find server/reader-sync-api-rs/target/debug/deps -maxdepth 1 -type f -name "${stem}-*" -perm -111 | sort | head -n 1)
            fi
            test -n "$runner"
            name="${stem}.runner"
            install -m 0755 "$runner" "target/sync-api-v5-e2e-runners/$name"
            printf 'runner=%s:%s\n' "$name" "$(sha256sum "target/sync-api-v5-e2e-runners/$name" | awk '{print $1}')" \
              >> target/sync-api-v5-e2e-runners/manifest.txt
          done
          test "$(grep -c '^runner=' target/sync-api-v5-e2e-runners/manifest.txt)" = 5

      - name: Upload protected E2E test runners
        uses: actions/upload-artifact@v6
        with:
          name: reader-sync-api-v5-e2e-runners
          path: target/sync-api-v5-e2e-runners/
          if-no-files-found: error
          retention-days: 3
