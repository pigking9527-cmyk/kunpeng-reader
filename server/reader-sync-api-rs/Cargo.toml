[package]
name = "reader-sync-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license-file = "../../LICENSE"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
axum = { version = "0.8.9", features = ["http1", "json", "matched-path", "tokio"] }
base64 = "0.22.1"
email_address = "0.2.9"
hmac = "0.13.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls-tls"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
rand = "0.10.2"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["derive", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring", "uuid"] }
thiserror = "2.0.20"
sha2 = "0.11.0"
subtle = "2.6.1"
time = { version = "=0.3.51", default-features = false, features = ["formatting", "parsing", "std"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "compression-gzip", "request-id", "sensitive-headers", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"

[workspace]
